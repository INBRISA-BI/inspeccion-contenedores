<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calidad INBRISA</title>
<link rel="stylesheet" href="base.css?v=6">
<style>
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .625rem 1rem; border-bottom: 1px solid var(--color-border-line); background: var(--color-panel); }
  .bar h1 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 1.25rem; }
  .tabs { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1; }
  .tabs button { font: inherit; border: 0; background: transparent; color: var(--color-fg-muted); padding: .4375rem .875rem; border-radius: var(--cds-radius); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--color-fg); color: var(--color-bg); }
  .who { display: flex; align-items: center; gap: .5rem; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  main { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--color-bg); display: none; }
  iframe.on { display: block; }
</style>
</head>
<body>
<header class="bar">
  <h1>Calidad INBRISA</h1>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" id="t-contenedores" data-tab="contenedores" aria-selected="false">Inspección de contenedores</button>
    <button role="tab" id="t-fichas" data-tab="fichas" aria-selected="false">Fichas de calidad</button>
    <button role="tab" id="t-offspec" data-tab="offspec" aria-selected="false">Registro off spec</button>
    <button role="tab" id="t-resumen" data-tab="resumen" aria-selected="false">Resumen off spec</button>
  </nav>
  <div class="who">
    <span id="who"></span>
    <button class="ic-login" id="login" hidden>Iniciar sesión con Microsoft</button>
    <button class="ic-btn2" id="logout" hidden>Cerrar sesión</button>
  </div>
</header>
<main>
  <iframe id="f-contenedores" title="Inspección de contenedores"></iframe>
  <iframe id="f-fichas" title="Fichas de calidad"></iframe>
  <iframe id="f-offspec" title="Registro de producto off spec"></iframe>
  <iframe id="f-resumen" title="Resumen de producto off spec"></iframe>
</main>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="config.js?v=6"></script>
<script src="gate.js?v=6"></script>
<script src="auth.js?v=6"></script>
<script>
  const SRC = { contenedores: 'contenedores.html?v=6', offspec: 'registro.html?v=6', resumen: 'resumen.html?v=6', fichas: window.APP_CONFIG.fichasUrl };
  const SCOPES = ['Files.Read.All', 'Sites.ReadWrite.All'];
  const $ = (id) => document.getElementById(id);
  function show(tab) {
    if (!SRC[tab]) tab = 'contenedores';
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    document.querySelectorAll('iframe').forEach((f) => f.classList.toggle('on', f.id === 'f-' + tab));
    const f = $('f-' + tab);
    if (!f.getAttribute('src')) f.setAttribute('src', SRC[tab]);
    try { const u = new URL(location.href); u.searchParams.set('tab', tab); history.replaceState(null, '', u); } catch (e) { /* sin historial */ }
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.tab)));
  window.addEventListener('message', (ev) => {
    if (ev.origin === location.origin && ev.data && ev.data.type === 'ic-login') window.icAuth.login(SCOPES);
  });
  window.icGate(async () => {
    const first = new URLSearchParams(location.search).get('tab');
    await window.icAuth.init();
    const acc = window.icAuth.account();
    $('who').textContent = acc ? (acc.name || acc.username) : '';
    $('login').hidden = !!acc;
    $('logout').hidden = !acc;
    $('login').addEventListener('click', () => window.icAuth.login(SCOPES));
    $('logout').addEventListener('click', () => window.icAuth.logout());
    show(first);
  });
</script>
</body>
</html>
